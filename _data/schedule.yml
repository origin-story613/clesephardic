# mode: "weekly" uses the standing rule below and computes Friday/Shabbat
# tefila times live from Hebcal's candle-lighting time. Switch to "holiday"
# and fill in `days` (see git history for examples) when a holiday schedule
# needs to override the regular weekly pattern.
mode: weekly
period: "Weekly Tefila Schedule"
parsha: "This Week's Parsha"

# Standing rule (in effect until holidays and/or the next clock change):
# - Friday night tefila = candle lighting time, rounded DOWN to the nearest
#   5 minutes (e.g. 5:47 -> 5:45, 5:02 -> 5:00)
# - Shabbat Mincha = that same Friday time, minus 15 minutes
# Both are computed in _includes/zmanim-script.html from the live Hebcal
# candle-lighting time. No Shaharit on a regular Shabbat (most weeks don't
# have one) -- set shaharit_time below only for a week that does.
shaharit_time: ""

days: []
